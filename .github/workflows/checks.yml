name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/skills/requirements.txt
      - run: python scripts/test-skills.py
      - run: python -m unittest discover -s tests/install
      - run: python -m unittest discover -s tests/skills
      - run: python -m unittest discover -s tests/repo
